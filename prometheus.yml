# Prometheus scrape + alerting configuration.
#
# This file is mounted by docker-compose.yml (`./prometheus.yml:/etc/prometheus/prometheus.yml`)
# but was never actually included anywhere in the original project -- the
# prometheus container would fail to start (no config file to read) without it.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Loads the latency/abuse SLI rules defined in alerts.yml.
rule_files:
  - "alerts.yml"

# Forwards firing alerts to the alertmanager service (see alertmanager.yml
# for Slack routing).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "support-agent"
    metrics_path: /metrics
    static_configs:
      - targets: ["support-agent:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
