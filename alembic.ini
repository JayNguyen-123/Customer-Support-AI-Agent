# A generic, single-database configuration blueprint matrix.

[alembic]
# Path to migration script location directories
script_location = alembic

# Template used to render the name of auto-generated migration files
# In production, using a slug makes changes instantly readable to devs in git branches
file_template = %%(rev)s_%%(slug)s

# Pre-pend system directory paths to sys.path
prepend_sys_path = .

# Timezone configuration for generated dates (UTC is mandatory for cloud infrastructure)
timezone = UTC

# The explicit default target database link connection string parameters.
# In container deployment pipelines, this parameter is dynamically over-ridden
# inside alembic/env.py using the environment variable string parameter target DATABASE_URL.
sqlalchemy.url = sqlite:///./users.db


# =====================================================================
# Logging Configuration Setup
# =====================================================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(asctime)s %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
